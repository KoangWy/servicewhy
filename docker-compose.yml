# Default (no credentials): `docker compose up` -> api in SAMPLE mode on :8000, ui on :5173.
# FULL mode: start the Zetaris bundle from its own compose and Meterless Nightshift (see README), fill .env, then
# `make full` (scripts/up-full.sh), which runs `docker compose --profile full up -d --build` and the seed job.
services:
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      SAMPLE_MODE: ${SAMPLE_MODE:-true}
      DATA_BACKEND: ${DATA_BACKEND:-zetaris}
      MODEL_MODE: ${MODEL_MODE:-live}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-meterless}
      METERLESS_RUNTIME_TOKEN: ${METERLESS_RUNTIME_TOKEN:-}
      METERLESS_MODEL: ${METERLESS_MODEL:-meterless/auto}
      METERLESS_APP: ${METERLESS_APP:-servicewhy}
      # Meterless Nightshift runs on the host and listens on loopback only. On Docker Desktop for Mac a container still reaches it
      # through host.docker.internal (checked 2026-10-27); on Linux this is UNVERIFIED. If the container cannot reach it, run the API
      # on the host instead: `SAMPLE_MODE=false python run.py` (the UI can stay in Docker or run via `npm run dev`).
      METERLESS_BASE_URL: ${METERLESS_BASE_URL_FROM_DOCKER:-http://host.docker.internal:8088/v1}
      LOGS_DIR: /app/logs-host
      # the Zetaris bundle publishes its ports on the host; reach it from inside this container
      ZETARIS_REST_URL: ${ZETARIS_REST_URL_FROM_DOCKER:-http://host.docker.internal:8888/api/v1.0}
      ZETARIS_LOGIN_URL: ${ZETARIS_LOGIN_URL_FROM_DOCKER:-http://host.docker.internal:3000/api}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./logs:/app/logs-host"]  # traces land in ./logs on the host; logs/examples stays in the image
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      retries: 6

  ui:
    build: { context: ., dockerfile: Dockerfile.ui }
    ports: ["5173:80"]
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    profiles: ["full"]
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-svcwhy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-servicewhy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svcwhy}"]
      interval: 5s
      retries: 12

  minio:
    # minio/minio is no longer published on Docker Hub or quay.io. Same release (2025-04-22), multi-arch, from the
    # Bitnami legacy repository; its entrypoint expects Bitnami's own run script as the command.
    image: bitnamilegacy/minio:2025.4.22-debian-12-r1
    profiles: ["full"]
    command: ["/opt/bitnami/scripts/minio/run.sh"]
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-svcwhy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      MINIO_SKIP_CLIENT: "yes"  # skips Bitnami's setup-time temporary server, so the health probe only sees the real one
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 12

  seed:  # one-shot: simulator -> Postgres + Parquet on MinIO -> idempotent Zetaris registration
    build: { context: ., dockerfile: Dockerfile.api }
    profiles: ["full"]
    command: ["python", "-m", "app.sim.load"]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: minio:9000
      ZETARIS_REST_URL: ${ZETARIS_REST_URL_FROM_DOCKER:-http://host.docker.internal:8888/api/v1.0}
      ZETARIS_LOGIN_URL: ${ZETARIS_LOGIN_URL_FROM_DOCKER:-http://host.docker.internal:3000/api}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./data:/app/data"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

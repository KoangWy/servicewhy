<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">ServiceWhy</title>
  <desc id="d">ServiceWhy, the agent that explains why a restaurant night went wrong. No receipt, no claim. Open Agent Hackathon 2026, Track 02, Team Irigo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b1f5c" flood-opacity="0.40"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#dots)"/>

  <!-- logo: the UI mark, inverted for the blue background -->
  <g transform="translate(56 44) scale(3.5)">
    <rect width="32" height="32" rx="8" fill="#ffffff"/>
    <path fill="#2563eb" d="M9 7h14v18l-2.33-2-2.34 2L16 23l-2.33 2-2.34-2L9 25z"/>
    <path fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" d="M13.6 12.4a2.4 2.4 0 1 1 3.6 2.1c-.8.5-1.2 1-1.2 1.9"/>
    <circle cx="16" cy="19.2" r="1.05" fill="#ffffff"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="190" y="120" font-size="72" font-weight="700" letter-spacing="-2" fill="#ffffff">Service<tspan fill="#bfdbfe">Why</tspan></text>
    <text x="56" y="196" font-size="27" fill="#ffffff" fill-opacity="0.95">The agent that explains why</text>
    <text x="56" y="230" font-size="27" fill="#ffffff" fill-opacity="0.95">a restaurant night went wrong.</text>
    <text x="56" y="271" font-size="17" fill="#dbeafe">Open Agent Hackathon 2026  ·  Track 02  ·  Team Irigo</text>
  </g>

  <!-- receipt: the product motif, "No receipt, no claim." -->
  <g transform="translate(852 24) rotate(3 140 124)" filter="url(#sh)">
    <path fill="#ffffff" d="M0 0H280V236l-14 12l-14-12l-14 12l-14-12l-14 12l-14-12l-14 12l-14-12l-14 12l-14-12l-14 12l-14-12l-14 12l-14-12l-14 12l-14-12l-14 12l-14-12l-14 12l-14-12Z"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="22" y="38" font-size="13" font-weight="700" letter-spacing="1.6" fill="#1e3a8a">SERVICEWHY · VERIFIED</text>
      <line x1="22" y1="52" x2="258" y2="52" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 4"/>

      <g transform="translate(32 76)"><circle r="9" fill="#16a34a"/><path d="M-4 0l3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="52" y="81" font-size="14" fill="#0f172a">V1 recomputed ±2%</text>

      <g transform="translate(32 104)"><circle r="9" fill="#16a34a"/><path d="M-4 0l3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="52" y="109" font-size="14" fill="#0f172a">V2 n ≥ 15 per group</text>

      <g transform="translate(32 132)"><circle r="9" fill="#16a34a"/><path d="M-4 0l3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="52" y="137" font-size="14" fill="#0f172a">V3 contrast found</text>

      <g transform="translate(32 160)"><circle r="9" fill="#dc2626"/><path d="M-3.5 -3.5l7 7M3.5 -3.5l-7 7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
      <text x="52" y="165" font-size="14" fill="#0f172a">unbacked claim</text>
      <rect x="190" y="150" width="62" height="20" rx="10" fill="#fee2e2"/>
      <text x="221" y="164" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">BLOCKED</text>

      <g transform="translate(32 188)"><circle r="9" fill="#f59e0b"/><path d="M-3.5 1.5a4 4 0 1 0 1.5-3.4M-2.6 -4.4l0.4 2.4 2.4 -0.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="52" y="193" font-size="14" fill="#0f172a">retry, wider sample</text>

      <line x1="22" y1="206" x2="258" y2="206" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="140" y="226" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#1d4ed8">NO RECEIPT, NO CLAIM.</text>
    </g>
  </g>
</svg>
